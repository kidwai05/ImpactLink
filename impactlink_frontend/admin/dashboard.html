<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard — ImpactLink</title>
<link rel="stylesheet" href="../css/theme.css"/>
<style>
canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.page-shell { position: relative; z-index: 1; }

/* ── Admin nav accent ── */
.nav { border-bottom-color: rgba(200,60,60,0.18); }
.nav-logo-admin {
  font-family: var(--font-display);
  font-size: 1.05rem; font-weight: 600; letter-spacing: 0.18em;
  color: var(--text-primary);
  text-shadow: 0 0 12px rgba(255,255,255,0.6), 0 0 30px rgba(255,140,140,0.25);
  text-decoration: none;
}
.admin-badge {
  font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: rgba(240,130,130,0.7);
  border: 1px solid rgba(200,60,60,0.30); border-radius: 3px;
  padding: 0.18rem 0.5rem; margin-left: 0.6rem; vertical-align: middle;
}

/* ── Hero ── */
.dash-hero {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 1.8rem; margin-bottom: 2rem;
  border-bottom: 1px solid rgba(200,60,60,0.10);
  animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both;
}
.dash-title { font-size: clamp(1.6rem, 3.5vw, 2.4rem); margin-bottom: 0.3rem; }
.dash-sub   { margin-top: 0.4rem; }

/* ── Stat row ── */
.stat-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
  margin-bottom: 2rem;
  animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.18s both;
}
.stat-box {
  background: linear-gradient(145deg, rgba(10,20,50,0.6), rgba(6,12,30,0.6));
  border: 1px solid rgba(40,80,180,0.20);
  border-radius: 10px; padding: 1.1rem 1.3rem;
  transition: border-color 0.3s, transform 0.3s;
}
.stat-box:hover { border-color: rgba(60,130,240,0.40); transform: translateY(-2px); }
.stat-box.red   { border-color: rgba(200,60,60,0.22); }
.stat-box.red:hover { border-color: rgba(240,100,100,0.45); }
.stat-box.amber { border-color: rgba(200,150,40,0.22); }
.stat-box.amber:hover { border-color: rgba(240,190,80,0.45); }
.stat-box.green { border-color: rgba(40,160,80,0.22); }
.stat-box.green:hover { border-color: rgba(60,200,110,0.45); }
.stat-num {
  font-family: var(--font-display); font-size: 1.8rem; font-weight: 600;
  color: var(--accent-blue); text-shadow: 0 0 12px rgba(122,171,238,0.5);
  line-height: 1;
}
.stat-box.red   .stat-num { color: rgba(240,130,130,0.9); text-shadow: 0 0 12px rgba(240,100,100,0.3); }
.stat-box.amber .stat-num { color: rgba(240,190,80,0.9);  text-shadow: 0 0 12px rgba(240,180,60,0.3); }
.stat-box.green .stat-num { color: rgba(100,210,140,0.9); text-shadow: 0 0 12px rgba(60,200,100,0.3); }
.stat-label {
  font-size: 0.60rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-muted); margin-top: 0.4rem;
}
.stat-sub {
  font-size: 0.62rem; color: var(--text-muted); margin-top: 0.5rem;
  padding-top: 0.5rem; border-top: 1px solid rgba(40,80,180,0.12);
}

/* ── Two-column layout ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin-bottom: 2rem; }

/* ── Section card ── */
.section-card {
  background: linear-gradient(145deg, #0a0e1a, #080c18);
  border: 1px solid rgba(40,80,180,0.22); border-radius: 12px;
  padding: 1.6rem; animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.28s both;
}
.section-card.full { grid-column: 1 / -1; }
.section-title {
  font-family: var(--font-display); font-size: 1.05rem; font-weight: 400;
  letter-spacing: 0.14em; color: var(--text-primary);
  text-shadow: 0 0 8px rgba(255,255,255,0.35);
  margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: space-between;
}
.section-link {
  font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent-blue); text-decoration: none;
  transition: text-shadow 0.2s;
}
.section-link:hover { text-shadow: 0 0 8px rgba(122,171,238,0.5); }

/* ── Pending NGO rows ── */
.pending-row {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.85rem 0; border-bottom: 1px solid rgba(40,80,180,0.10);
  transition: background 0.2s; border-radius: 4px;
}
.pending-row:last-child { border-bottom: none; }
.pending-logo {
  width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
  background: rgba(200,150,40,0.10); border: 1px solid rgba(200,150,40,0.22);
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
}
.pending-info { flex: 1; min-width: 0; }
.pending-name {
  font-family: var(--font-display); font-size: 0.88rem; font-weight: 600;
  letter-spacing: 0.08em; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pending-meta { font-size: 0.62rem; color: var(--text-muted); margin-top: 0.2rem; letter-spacing: 0.06em; }
.pending-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
.action-btn {
  font-family: var(--font-body); font-size: 0.60rem; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.4rem 0.8rem; border-radius: 3px; cursor: pointer; transition: all 0.22s; border: 1px solid;
}
.action-verify {
  color: rgba(100,210,140,0.85); border-color: rgba(60,180,100,0.30);
  background: rgba(20,80,45,0.12);
}
.action-verify:hover { background: rgba(30,100,55,0.22); border-color: rgba(80,210,130,0.55); }
.action-reject {
  color: rgba(240,130,130,0.75); border-color: rgba(200,60,60,0.25);
  background: rgba(50,10,10,0.10);
}
.action-reject:hover { background: rgba(80,15,15,0.22); border-color: rgba(240,100,100,0.50); }

/* ── Recent donations ── */
.donation-row {
  display: flex; align-items: center; gap: 0.9rem;
  padding: 0.75rem 0; border-bottom: 1px solid rgba(40,80,180,0.10);
}
.donation-row:last-child { border-bottom: none; }
.don-icon {
  width: 34px; height: 34px; border-radius: 7px; flex-shrink: 0;
  background: rgba(20,40,90,0.25); border: 1px solid rgba(40,80,180,0.20);
  display: flex; align-items: center; justify-content: center; font-size: 1rem;
}
.don-info { flex: 1; min-width: 0; }
.don-org  { font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.don-meta { font-size: 0.60rem; color: var(--text-muted); margin-top: 0.18rem; }
.don-amount { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; color: var(--accent-blue); text-shadow: 0 0 8px rgba(122,171,238,0.4); flex-shrink: 0; }

/* ── Category breakdown ── */
.cat-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.55rem 0; }
.cat-label { font-size: 0.65rem; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-muted); width: 90px; flex-shrink: 0; }
.cat-bar-wrap { flex: 1; height: 4px; background: rgba(40,80,180,0.12); border-radius: 4px; overflow: hidden; }
.cat-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent-blue), rgba(122,171,238,0.5)); transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
.cat-count { font-family: var(--font-display); font-size: 0.75rem; color: rgba(150,185,240,0.7); width: 30px; text-align: right; flex-shrink: 0; }

/* ── Empty ── */
.mini-empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.74rem; letter-spacing: 0.08em; }

/* ── Shimmer ── */
.shimmer { border-radius: 6px; height: 60px; background: linear-gradient(90deg, rgba(20,35,90,0.2) 25%, rgba(30,55,140,0.3) 50%, rgba(20,35,90,0.2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; margin-bottom: 0.6rem; }
@keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="page-shell">
  <nav class="nav">
    <a href="../index.html" class="nav-logo-admin">ImpactLink <span class="admin-badge">Admin</span></a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="verify.html"    class="nav-link">Verify</a>
      <a href="ngos.html"      class="nav-link">NGOs</a>
      <a href="donors.html" class="nav-link">Donors</a>
      <button class="nav-link logout" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="page-content">

    <div class="dash-hero">
      <div>
        <div class="display-heading dash-title">Admin Dashboard</div>
        <div class="sub-heading dash-sub">Platform overview &amp; activity</div>
      </div>
      <div style="font-family:var(--font-body);font-size:0.65rem;letter-spacing:0.14em;color:var(--text-muted);" id="last-updated"></div>
    </div>

    <!-- Stats -->
    <div class="stat-row" id="stat-row">
      <div class="shimmer"></div><div class="shimmer"></div>
      <div class="shimmer"></div><div class="shimmer"></div>
    </div>

    <!-- Two-col -->
    <div class="two-col">

      <!-- Pending NGOs -->
      <div class="section-card">
        <div class="section-title">
          Pending Verification
          <a href="verify.html" class="section-link">View All →</a>
        </div>
        <div id="pending-list"><div class="shimmer"></div><div class="shimmer"></div></div>
      </div>

      <!-- Recent Donations -->
      <div class="section-card">
        <div class="section-title">Recent Donations</div>
        <div id="recent-donations"><div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div></div>
      </div>

      <!-- Category breakdown -->
      <div class="section-card">
        <div class="section-title">NGOs by Category</div>
        <div id="cat-breakdown"><div class="shimmer"></div></div>
      </div>

      <!-- City breakdown -->
      <div class="section-card">
        <div class="section-title">NGOs by City</div>
        <div id="city-breakdown"><div class="shimmer"></div></div>
      </div>

    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/api.js"></script>
<script>
/* ── Background ─────────────────────────────────────────────── */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const ARCS = [
  {a0:3.9,a1:5.5,r:0.44,lw:90,alpha:0.05,blur:55,color:'20,55,160'},
  {a0:3.95,a1:5.45,r:0.43,lw:35,alpha:0.10,blur:28,color:'30,75,190'},
  {a0:4.0,a1:5.4,r:0.42,lw:9,alpha:0.28,blur:6,color:'55,115,230'},
  {a0:0.8,a1:2.4,r:0.38,lw:80,alpha:0.04,blur:50,color:'15,45,150'},
  {a0:0.9,a1:2.3,r:0.36,lw:8,alpha:0.22,blur:6,color:'50,105,220'},
];
(function draw(){
  const W=canvas.width,H=canvas.height,cx=W*.5,cy=H*.5,b=Math.min(W,H);
  ctx.clearRect(0,0,W,H);
  ARCS.forEach(a=>{ ctx.save(); ctx.filter=`blur(${a.blur}px)`; ctx.strokeStyle=`rgba(${a.color},${a.alpha})`; ctx.lineWidth=a.lw; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(cx,cy,a.r*b,a.a0,a.a1); ctx.stroke(); ctx.restore(); });
})();

/* ── Auth ───────────────────────────────────────────────────── */
if (!api.admin.requireAuth()) throw 0;

function handleLogout() { api.admin.logout(); window.location.href = '../index.html'; }

function showToast(msg, type='success') {
  const tc=document.getElementById('toast-container'), t=document.createElement('div');
  t.className=`toast toast-${type}`; t.textContent=msg; tc.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3000);
}

/* ── Helpers ─────────────────────────────────────────────────── */
const CAT_ICONS = { Education:'📚', Health:'💧', Environment:'🌱', Poverty:'🏠', Women:'✊', Children:'👦', Disaster:'🚨', Animals:'🐾', default:'🤝' };

function fmtMoney(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(0)+'K' : String(n); }

/* ── Render stats ────────────────────────────────────────────── */
function renderStats(s) {
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-box">
      <div class="stat-num">${s.totalDonors}</div>
      <div class="stat-label">Registered Donors</div>
      <div class="stat-sub">Active on platform</div>
    </div>
    <div class="stat-box ${s.pendingNgos > 0 ? 'amber' : 'green'}">
      <div class="stat-num">${s.registeredNgos}</div>
      <div class="stat-label">Registered NGOs</div>
      <div class="stat-sub">${s.pendingNgos} pending · ${s.verifiedNgos} verified</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">${s.totalDonations}</div>
      <div class="stat-label">Total Donations</div>
      <div class="stat-sub">All time transactions</div>
    </div>
    <div class="stat-box green">
      <div class="stat-num">PKR ${fmtMoney(s.totalRaised)}</div>
      <div class="stat-label">Total Raised</div>
      <div class="stat-sub">Across all NGOs</div>
    </div>`;
}

/* ── Render pending ──────────────────────────────────────────── */
function renderPending(list) {
  const el = document.getElementById('pending-list');
  if (!list.length) { el.innerHTML = `<div class="mini-empty">No pending verifications ✓</div>`; return; }
  el.innerHTML = list.slice(0,5).map(n => `
    <div class="pending-row" id="pr-${n.email.replace(/[@.]/g,'_')}">
      <div class="pending-logo">${CAT_ICONS[n.category] || CAT_ICONS.default}</div>
      <div class="pending-info">
        <div class="pending-name">${n.orgName}</div>
        <div class="pending-meta">${n.category || '—'} &nbsp;·&nbsp; ${n.city || '—'} &nbsp;·&nbsp; Joined ${n.joinedAt || '—'}</div>
      </div>
      <div class="pending-actions">
        <button class="action-btn action-verify" onclick="quickVerify('${n.email}')">Verify</button>
        <button class="action-btn action-reject" onclick="quickReject('${n.email}')">Reject</button>
      </div>
    </div>`).join('');
}

/* ── Render recent donations ─────────────────────────────────── */
function renderRecent(list) {
  const el = document.getElementById('recent-donations');
  if (!list.length) { el.innerHTML = `<div class="mini-empty">No donations yet</div>`; return; }
  el.innerHTML = list.slice(0,7).map(d => `
    <div class="donation-row">
      <div class="don-icon">${CAT_ICONS[d.category] || CAT_ICONS.default}</div>
      <div class="don-info">
        <div class="don-org">${d.org}</div>
        <div class="don-meta">${d.donorName || d.donorEmail || 'Anonymous'} &nbsp;·&nbsp; ${d.date}</div>
      </div>
      <div class="don-amount">PKR ${(d.amount||0).toLocaleString()}</div>
    </div>`).join('');
}

/* ── Render breakdowns ───────────────────────────────────────── */
function renderBreakdown(containerId, data) {
  const el = document.getElementById(containerId);
  if (!data.length) { el.innerHTML = `<div class="mini-empty">No data yet</div>`; return; }
  const max = Math.max(...data.map(d => d.count), 1);
  el.innerHTML = data.map(d => `
    <div class="cat-row">
      <div class="cat-label">${d.label}</div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round(d.count/max*100)}%"></div></div>
      <div class="cat-count">${d.count}</div>
    </div>`).join('');
}

/* ── Quick actions ───────────────────────────────────────────── */
async function quickVerify(email) {
  try {
    await api.admin.verifyNgo(email);
    const key = email.replace(/[@.]/g,'_');
    document.getElementById('pr-'+key)?.remove();
    showToast('NGO verified successfully', 'success');
    load(); // refresh stats
  } catch(e) { showToast(e.message, 'error'); }
}

async function quickReject(email) {
  if (!confirm('Reject and permanently delete this NGO registration?')) return;
  try {
    await api.admin.rejectNgo(email);
    const key = email.replace(/[@.]/g,'_');
    document.getElementById('pr-'+key)?.remove();
    showToast('NGO rejected and removed', 'error');
    load();
  } catch(e) { showToast(e.message, 'error'); }
}

/* ── Load ────────────────────────────────────────────────────── */
async function load() {
  try {
    const [summary, pending, allNgos] = await Promise.all([
      api.admin.getSummary(),
      api.admin.getPendingNgos(),
      api.admin.getAllNgos(),
    ]);

    renderStats(summary);
    renderPending(pending);
    renderRecent(summary.recentDonations);

    // Category breakdown from registered NGOs
    const catMap = {};
    allNgos.forEach(n => { const c = n.category || 'Other'; catMap[c] = (catMap[c]||0) + 1; });
    const catData = Object.entries(catMap).map(([label,count])=>({label,count})).sort((a,b)=>b.count-a.count);
    renderBreakdown('cat-breakdown', catData);

    // City breakdown
    const cityMap = {};
    allNgos.forEach(n => { const c = n.city || 'Other'; cityMap[c] = (cityMap[c]||0) + 1; });
    const cityData = Object.entries(cityMap).map(([label,count])=>({label,count})).sort((a,b)=>b.count-a.count);
    renderBreakdown('city-breakdown', cityData);

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-PK', {hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    showToast('Failed to load dashboard data', 'error');
  }
}

load();
</script>
</body>
</html>
