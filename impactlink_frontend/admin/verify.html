<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify NGOs — ImpactLink Admin</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-shell {
            position: relative;
            z-index: 1;
        }

        .nav-logo-admin {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            color: var(--text-primary);
            text-shadow: 0 0 12px rgba(255,255,255,0.6), 0 0 30px rgba(255,140,140,0.25);
            text-decoration: none;
        }

        .admin-badge {
            font-family: var(--font-body);
            font-size: 0.55rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(240,130,130,0.7);
            border: 1px solid rgba(200,60,60,0.30);
            border-radius: 3px;
            padding: 0.18rem 0.5rem;
            margin-left: 0.6rem;
            vertical-align: middle;
        }

        /* ── Hero ── */
        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 1.8rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(200,150,40,0.12);
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both;
        }

        .hero-title {
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            margin-bottom: 0.3rem;
        }

        /* ── Counter strip ── */
        .counter-strip {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.18s both;
        }

        .counter-box {
            background: linear-gradient(145deg, rgba(10,20,50,0.6), rgba(6,12,30,0.6));
            border: 1px solid rgba(40,80,180,0.20);
            border-radius: 10px;
            padding: 0.9rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .counter-num {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
        }

            .counter-num.amber {
                color: rgba(240,190,80,0.9);
                text-shadow: 0 0 10px rgba(240,180,60,0.3);
            }

            .counter-num.green {
                color: rgba(100,210,140,0.9);
                text-shadow: 0 0 10px rgba(60,200,100,0.3);
            }

            .counter-num.blue {
                color: var(--accent-blue);
                text-shadow: 0 0 10px rgba(122,171,238,0.4);
            }

        .counter-label {
            font-size: 0.60rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ── Cards grid ── */
        .ngo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.2rem;
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.25s both;
        }

        .verify-card {
            background: linear-gradient(145deg, #0c0e20, #080b18);
            border: 1px solid rgba(200,150,40,0.28);
            border-radius: 12px;
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            animation: cardRise 0.75s cubic-bezier(0.22,1,0.36,1) both;
        }

            .verify-card:hover {
                border-color: rgba(240,190,80,0.50);
                box-shadow: 0 0 28px rgba(200,150,40,0.10);
            }

        /* Card top */
        .vc-top {
            display: flex;
            align-items: flex-start;
            gap: 0.9rem;
        }

        .vc-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            flex-shrink: 0;
            background: rgba(200,150,40,0.10);
            border: 1px solid rgba(200,150,40,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .vc-name {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.10em;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .vc-email {
            font-size: 0.63rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            letter-spacing: 0.06em;
        }

        /* Field rows */
        .vc-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 1rem;
        }

        .vc-field-label {
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .vc-field-value {
            font-size: 0.78rem;
            color: rgba(210,200,240,0.80);
            margin-top: 0.15rem;
        }

        /* Mission box */
        .vc-mission {
            font-size: 0.76rem;
            color: var(--text-body);
            line-height: 1.6;
            background: rgba(10,14,30,0.50);
            border: 1px solid rgba(40,80,180,0.14);
            border-radius: 6px;
            padding: 0.75rem 0.9rem;
        }

        .vc-mission-label {
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        /* Status badge */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.22rem 0.65rem;
            border-radius: 20px;
        }

        .status-pending {
            color: rgba(240,190,80,0.85);
            border: 1px solid rgba(200,150,40,0.35);
            background: rgba(80,60,10,0.15);
        }

        .status-verified {
            color: rgba(100,210,140,0.85);
            border: 1px solid rgba(60,180,100,0.35);
            background: rgba(20,80,45,0.15);
        }

        /* Actions */
        .vc-actions {
            display: flex;
            gap: 0.6rem;
        }

        .vc-btn {
            flex: 1;
            font-family: var(--font-body);
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .vc-verify {
            color: rgba(100,210,140,0.9);
            border-color: rgba(60,180,100,0.35);
            background: rgba(20,80,45,0.12);
        }

            .vc-verify:hover {
                background: rgba(30,100,55,0.25);
                border-color: rgba(80,210,130,0.65);
            }

        .vc-reject {
            flex: 0 0 auto;
            padding: 0.7rem 1.1rem;
            color: rgba(240,130,130,0.75);
            border-color: rgba(200,60,60,0.25);
            background: rgba(50,10,10,0.10);
        }

            .vc-reject:hover {
                background: rgba(80,15,15,0.25);
                border-color: rgba(240,100,100,0.55);
            }

        /* Empty / shimmer */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            grid-column: 1/-1;
        }

        .empty-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            color: var(--text-primary);
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .empty-sub {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .shimmer-card {
            height: 220px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(20,35,90,0.2) 25%, rgba(30,55,140,0.3) 50%, rgba(20,35,90,0.2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }


        /* ── Documents ── */
        .vc-docs {
        }

        .vc-doc-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid rgba(200,150,40,0.08);
            font-size: 0.72rem;
        }

            .vc-doc-item:last-child {
                border-bottom: none;
            }

        .vc-doc-icon {
            font-size: 0.9rem;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .vc-doc-name {
            color: rgba(220,205,245,0.80);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vc-doc-type {
            font-size: 0.58rem;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .vc-docs-loading {
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 0.5rem 0;
        }
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.6rem;
            border: 1px solid rgba(40,80,180,0.20);
            border-radius: 4px;
            overflow: hidden;
            width: fit-content;
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.22s both;
        }

        .tab-btn {
            font-family: var(--font-body);
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.22s;
            border-right: 1px solid rgba(40,80,180,0.20);
        }

            .tab-btn:last-child {
                border-right: none;
            }

            .tab-btn.active {
                background: rgba(30,70,180,0.14);
                color: var(--accent-blue);
            }

            .tab-btn:hover:not(.active) {
                color: rgba(160,200,240,0.65);
            }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div class="page-shell">
        <nav class="nav">
            <a href="../index.html" class="nav-logo-admin">ImpactLink <span class="admin-badge">Admin</span></a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="verify.html" class="nav-link active">Verify</a>
                <a href="ngos.html" class="nav-link">NGOs</a>
                <a href="donors.html" class="nav-link">Donors</a>
                <button class="nav-link logout" onclick="handleLogout()">Logout</button>
            </div>
        </nav>

        <div class="page-content">

            <div class="hero">
                <div>
                    <div class="display-heading hero-title">Verification Queue</div>
                    <div class="sub-heading" style="margin-top:0.4rem;">Review and approve NGO registrations</div>
                </div>
            </div>

            <!-- Counters -->
            <div class="counter-strip" id="counter-strip">
                <div class="counter-box"><div class="counter-num amber" id="c-pending">—</div><div><div class="counter-label">Awaiting Review</div></div></div>
                <div class="counter-box"><div class="counter-num green" id="c-verified">—</div><div><div class="counter-label">Verified</div></div></div>
                <div class="counter-box"><div class="counter-num blue" id="c-total">—</div><div><div class="counter-label">Total Registered</div></div></div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" id="tab-pending" onclick="setTab('pending')">Pending</button>
                <button class="tab-btn" id="tab-verified" onclick="setTab('verified')">Verified</button>
            </div>

            <!-- Grid -->
            <div class="ngo-grid" id="ngo-grid">
                <div class="shimmer-card"></div>
                <div class="shimmer-card"></div>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/api.js"></script>
    <script>
        /* ── Background ─────────────────────────────────────────── */
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        (function draw() {
            const W = canvas.width, H = canvas.height, cx = W * .5, cy = H * .5, b = Math.min(W, H);
            ctx.clearRect(0, 0, W, H);
            [{ a0: 3.9, a1: 5.5, r: 0.44, lw: 90, alpha: 0.05, blur: 55, color: '20,55,160' }, { a0: 4.0, a1: 5.4, r: 0.42, lw: 9, alpha: 0.28, blur: 6, color: '55,115,230' }, { a0: 0.9, a1: 2.3, r: 0.36, lw: 8, alpha: 0.22, blur: 6, color: '50,105,220' }].forEach(a => {
                ctx.save(); ctx.filter = `blur(${a.blur}px)`; ctx.strokeStyle = `rgba(${a.color},${a.alpha})`; ctx.lineWidth = a.lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, a.r * b, a.a0, a.a1); ctx.stroke(); ctx.restore();
            });
        })();

        /* ── Auth ───────────────────────────────────────────────── */
        if (!api.admin.requireAuth()) throw 0;
        function handleLogout() { api.admin.logout(); window.location.href = '../index.html'; }

        function showToast(msg, type = 'success') {
            const tc = document.getElementById('toast-container'), t = document.createElement('div');
            t.className = `toast toast-${type}`; t.textContent = msg; tc.appendChild(t);
            requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
        }

        const CAT_ICONS = { Education: '📚', Health: '💧', Environment: '🌱', Poverty: '🏠', Women: '✊', Children: '👦', Disaster: '🚨', Animals: '🐾', default: '🤝' };

        let allNgos = [], currentTab = 'pending';

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
            document.getElementById('tab-verified').classList.toggle('active', tab === 'verified');
            renderGrid();
            const visibleNgos = tab === 'pending' ? allNgos.filter(n => !n.verified) : allNgos.filter(n => n.verified);
            loadDocumentsForCards(visibleNgos);
        }

        function renderGrid() {
            const grid = document.getElementById('ngo-grid');
            const list = currentTab === 'pending'
                ? allNgos.filter(n => !n.verified)
                : allNgos.filter(n => n.verified);

            if (!list.length) {
                grid.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${currentTab === 'pending' ? '✓' : '○'}</div>
          <div class="empty-title">${currentTab === 'pending' ? 'Queue is Clear' : 'None Verified Yet'}</div>
          <div class="empty-sub">${currentTab === 'pending' ? 'No NGOs are awaiting review.' : 'Verified NGOs will appear here.'}</div>
        </div>`;
                return;
            }

            grid.innerHTML = list.map((n, i) => `
        <div class="verify-card" id="vc-${n.email.replace(/[@.]/g, '_')}" style="animation-delay:${0.04 + i * 0.06}s">
          <div class="vc-top">
            <div class="vc-logo">${CAT_ICONS[n.category] || CAT_ICONS.default}</div>
            <div style="flex:1;min-width:0;">
              <div class="vc-name">${n.orgName}</div>
              <div class="vc-email">${n.email}</div>
            </div>
            <div class="status-pill ${n.verified ? 'status-verified' : 'status-pending'}">
              ${n.verified ? '● Verified' : '◌ Pending'}
            </div>
          </div>

          <div class="vc-fields">
            <div>
              <div class="vc-field-label">Category</div>
              <div class="vc-field-value">${n.category || '—'}</div>
            </div>
            <div>
              <div class="vc-field-label">City</div>
              <div class="vc-field-value">${n.city || '—'}</div>
            </div>
            <div>
              <div class="vc-field-label">Phone</div>
              <div class="vc-field-value">${n.phone || '—'}</div>
            </div>
            <div>
              <div class="vc-field-label">Registered</div>
              <div class="vc-field-value">${n.joinedAt || '—'}</div>
            </div>
            ${n.verified ? `<div><div class="vc-field-label">Verified On</div><div class="vc-field-value">${n.verifiedAt || '—'}</div></div>` : ''}
          </div>

          ${n.mission ? `
            <div class="vc-mission">
              <div class="vc-mission-label">Mission</div>
              ${n.mission}
            </div>` : ''}

          <div>
            <div class="vc-field-label" style="margin-bottom:0.5rem;">Verification Documents</div>
            <div class="vc-docs" id="docs-${n.ngo_id}">
              <div class="vc-docs-loading">Loading…</div>
            </div>
          </div>

          ${!n.verified ? `
            <div class="vc-actions">
              <button class="vc-btn vc-verify" onclick="doVerify('${n.email}')">
                <span>✓</span> Approve
              </button>
              <button class="vc-btn vc-reject" onclick="doReject('${n.email}')">✕</button>
            </div>` : `
            <div style="font-size:0.65rem;letter-spacing:0.12em;color:rgba(100,210,140,0.6);text-align:center;padding:0.3rem 0;">
              ✓ Approved and active on platform
            </div>`}
        </div>`).join('');
        }


        async function loadDocumentsForCards(list) {
            for (const n of list) {
                const el = document.getElementById('docs-' + n.ngo_id);
                if (!el) continue;
                try {
                    const docs = await api.admin.getNgoDocuments(n.ngo_id);
                    if (!docs.length) {
                        el.innerHTML = '<div class="vc-docs-loading">No documents uploaded.</div>';
                    } else {
                        const DOC_ICONS = { registration: '📄', tax: '📋', identity: '🪪', other: '📎' };
                        el.innerHTML = docs.map(d => {
                            const nameOrLink = d.FILE_NAME || d.FILE_PATH || 'Document';
                            const isUrl = nameOrLink.startsWith('http://') || nameOrLink.startsWith('https://');
                            const DOC_ICONS = { registration: '📄', tax: '📋', identity: '🪪', other: '📎' };
                            // For plain filenames, construct a backend download URL
                            const href = isUrl
                                ? nameOrLink
                                : `http://localhost:3000/api/v1/ngos/documents/file/${encodeURIComponent(nameOrLink)}`;
                            return `<div class="vc-doc-item">
                <div class="vc-doc-icon">${DOC_ICONS[d.DOC_TYPE] || DOC_ICONS.other}</div>
                <a href="${href}" target="_blank" rel="noopener" class="vc-doc-name"
                   style="color:var(--accent-blue);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                   title="${nameOrLink}">${nameOrLink}</a>
                <div class="vc-doc-type">${d.DOC_TYPE || 'other'}</div>
              </div>`;
                        }).join('');
                    }
                } catch (e) {
                    el.innerHTML = '<div class="vc-docs-loading">—</div>';
                }
            }
        }
        async function doVerify(email) {
            try {
                await api.admin.verifyNgo(email);
                const ngo = allNgos.find(n => n.email === email);
                if (ngo) { ngo.verified = true; ngo.verifiedAt = new Date().toISOString().split('T')[0]; }
                updateCounters();
                renderGrid();
                showToast('NGO verified successfully', 'success');
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function doReject(email) {
            if (!confirm('Reject and permanently delete this NGO registration?')) return;
            try {
                await api.admin.rejectNgo(email);
                allNgos = allNgos.filter(n => n.email !== email);
                updateCounters();
                renderGrid();
                showToast('NGO rejected and removed', 'error');
            } catch (e) { showToast(e.message, 'error'); }
        }

        function updateCounters() {
            document.getElementById('c-pending').textContent = allNgos.filter(n => !n.verified).length;
            document.getElementById('c-verified').textContent = allNgos.filter(n => n.verified).length;
            document.getElementById('c-total').textContent = allNgos.length;
        }

        async function load() {
            try {
                allNgos = await api.admin.getAllNgos();
                updateCounters();
                renderGrid();
                // Load documents for currently visible cards
                const visibleNgos = currentTab === 'pending' ? allNgos.filter(n => !n.verified) : allNgos.filter(n => n.verified);
                loadDocumentsForCards(visibleNgos);
            } catch (e) {
                showToast('Failed to load NGOs', 'error');
            }
        }

        load();
    </script>
</body>
</html>
